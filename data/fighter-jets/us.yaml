# 美国战斗机科技树 (1945–至今)
# 图片由 scripts/fetch-images.mjs 从 Wikipedia/Wikimedia Commons 下载

tree:
  axes:
    x:
      type: category
      categories:
        - { id: air-superiority, label: { en: Air Superiority, zh: 空优 } }
        - { id: interceptor, label: { en: Interceptor, zh: 截击 } }
        - { id: multirole, label: { en: Multirole, zh: 多用途 } }
        - { id: ground-attack, label: { en: Ground Attack, zh: 对地攻击 } }
        - { id: carrier, label: { en: Carrier-based, zh: 舰载 } }
      spacing: 340
    y:
      type: year
      min: 1940
      max: 2030
      tick: 10
      pixelsPerYear: 26

  bands:
    - { id: gen1, from: 1942, to: 1955, label: { en: Jet Gen 1, zh: 第一代喷气 }, color: "#4d9fff14" }
    - { id: gen2, from: 1955, to: 1970, label: { en: Jet Gen 2, zh: 第二代喷气 }, color: "#4dd6ff10" }
    - { id: gen3, from: 1970, to: 1990, label: { en: Jet Gen 3, zh: 第三代喷气 }, color: "#7cfc9e0e" }
    - { id: gen4, from: 1990, to: 2010, label: { en: Jet Gen 4, zh: 第四代喷气 }, color: "#ffd1660e" }
    - { id: gen5, from: 2010, to: 2030, label: { en: Jet Gen 5, zh: 第五代喷气 }, color: "#ff5c6c0e" }

  defaultEdge:
    style: dashed
    path: straight

  # YAML 锚点:复用常用 label(YAML 特性,非 schema 字段,解析后自动剥离)
  defs:
    first-flight: &first-flight { en: First flight, zh: 首飞 }
    max-speed: &max-speed { en: Max speed, zh: 最大速度 }
    produced: &produced { en: Produced, zh: 产量 }
    manufacturer: &manufacturer { en: Manufacturer, zh: 制造商 }
    credit: &credit { en: Wikimedia Commons, zh: 维基共享资源 }
    role-fighter: &role-fighter { en: Fighter, zh: 战斗机 }
    role-interceptor: &role-interceptor { en: Interceptor, zh: 截击机 }
    role-multirole: &role-multirole { en: Multirole fighter, zh: 多用途战斗机 }
    role-attack: &role-attack { en: Attack aircraft, zh: 攻击机 }
    role-carrier: &role-carrier { en: Carrier fighter, zh: 舰载战斗机 }
    lbl-successor: &lbl-successor { en: Successor, zh: 后继 }
    lbl-derivative: &lbl-derivative { en: Derivative, zh: 改型 }
    lbl-lineage: &lbl-lineage { en: Lineage, zh: 技术传承 }

  nodes:
    - id: p-80
      x: air-superiority
      y: 1945
      year: 1945
      label: { en: P-80 Shooting Star, zh: P-80 流星 }
      role: *role-fighter
      status: retired
      wiki: Lockheed P-80 Shooting Star
      image: assets/us/p-80.webp
      imageCredit: *credit
      summary:
        en: America's first operational jet fighter, designed and flown in under 150 days.
        zh: 美国第一种投入服役的喷气战斗机,从设计到首飞不到 150 天。
      details:
        specs:
          - { label: *first-flight, value: "1944" }
          - { label: *max-speed, value: "965 km/h" }
          - { label: *produced, value: "1,715" }
          - { label: *manufacturer, value: Lockheed }
    - id: f-84
      x: ground-attack
      y: 1947
      year: 1947
      label: { en: F-84 Thunderjet, zh: F-84 雷电 }
      role: *role-attack
      status: retired
      wiki: Republic F-84 Thunderjet
      image: assets/us/f-84.webp
      imageCredit: *credit
      summary:
        en: Straight-wing jet fighter-bomber, a workhorse of ground attack in Korea.
        zh: 直翼喷气战斗轰炸机,朝鲜战争对地攻击的主力之一。
      details:
        specs:
          - { label: *first-flight, value: "1946" }
          - { label: *max-speed, value: "1,053 km/h" }
          - { label: *produced, value: "7,524" }
          - { label: *manufacturer, value: Republic }
    - id: f-86
