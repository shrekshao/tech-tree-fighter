name: Validate data & build

on:
  pull_request:
    paths:
      - "data/**"
      - "src/schema/**"
      - "src/data/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data schemas
        run: npm run validate:data
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
